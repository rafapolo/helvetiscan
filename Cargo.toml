[package]
name = "helvetiscan"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
md5 = "0.8"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
futures-util = "0.3"
hickory-resolver = "0.26"
reqwest = { version = "0.13", default-features = false, features = ["brotli", "deflate", "gzip", "hickory-dns", "http2", "rustls", "webpki-roots", "stream"] }
rustls = "0.23"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
webpki-roots = "1"
x509-parser = "0.18"
sha2 = "0.11"
sha1 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
maxminddb = "0.24"
htmd = "0.5"
arrow = { version = "59", default-features = false, features = ["ipc"] }
parquet = { version = "59", features = ["arrow"] }
